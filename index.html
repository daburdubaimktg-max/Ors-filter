<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1a13" />
  <title>CrownCam · GHABA × ORS Olive Oil</title>
  <meta name="description" content="Put on the olive-leaf crown, add your name and share it to your Stories. GHABA × ORS Olive Oil · Stylist of the Future." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600;1,800&family=Inter:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main id="app" class="app" data-mode="start">
    <div class="stage-wrap">
      <canvas id="stage" width="1080" height="1920" aria-label="Your photo with the olive-leaf crown"></canvas>
      <video id="video" playsinline muted autoplay hidden></video>

      <section class="start" aria-labelledby="start-title">
        <div class="start-inner">
          <svg class="crest" viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3de8a"/><stop offset="1" stop-color="#c9a227"/></linearGradient></defs><g fill="url(#gold)"><ellipse cx="45.8" cy="93.2" rx="8.9" ry="3.6" transform="rotate(162 45.8 93.2) translate(7.9 0)"/><ellipse cx="45.8" cy="93.2" rx="8.9" ry="3.6" transform="rotate(242 45.8 93.2) translate(7.9 0)"/><ellipse cx="35.3" cy="86.9" rx="8.5" ry="3.4" transform="rotate(180 35.3 86.9) translate(7.5 0)"/><ellipse cx="35.3" cy="86.9" rx="8.5" ry="3.4" transform="rotate(260 35.3 86.9) translate(7.5 0)"/><ellipse cx="27.4" cy="77.6" rx="8.1" ry="3.2" transform="rotate(199 27.4 77.6) translate(7.1 0)"/><ellipse cx="27.4" cy="77.6" rx="8.1" ry="3.2" transform="rotate(279 27.4 77.6) translate(7.1 0)"/><ellipse cx="22.9" cy="66.2" rx="7.7" ry="3.1" transform="rotate(218 22.9 66.2) translate(6.8 0)"/><ellipse cx="22.9" cy="66.2" rx="7.7" ry="3.1" transform="rotate(298 22.9 66.2) translate(6.8 0)"/><ellipse cx="22.2" cy="54.0" rx="7.2" ry="2.9" transform="rotate(236 22.2 54.0) translate(6.4 0)"/><ellipse cx="22.2" cy="54.0" rx="7.2" ry="2.9" transform="rotate(316 22.2 54.0) translate(6.4 0)"/><ellipse cx="25.4" cy="42.2" rx="6.8" ry="2.7" transform="rotate(254 25.4 42.2) translate(6.0 0)"/><ellipse cx="25.4" cy="42.2" rx="6.8" ry="2.7" transform="rotate(334 25.4 42.2) translate(6.0 0)"/><ellipse cx="32.2" cy="32.1" rx="6.4" ry="2.5" transform="rotate(273 32.2 32.1) translate(5.6 0)"/><ellipse cx="32.2" cy="32.1" rx="6.4" ry="2.5" transform="rotate(353 32.2 32.1) translate(5.6 0)"/><ellipse cx="41.9" cy="24.6" rx="5.9" ry="2.4" transform="rotate(292 41.9 24.6) translate(5.2 0)"/><ellipse cx="41.9" cy="24.6" rx="5.9" ry="2.4" transform="rotate(372 41.9 24.6) translate(5.2 0)"/><ellipse cx="53.4" cy="20.6" rx="5.5" ry="2.2" transform="rotate(310 53.4 20.6) translate(4.9 0)"/><ellipse cx="53.4" cy="20.6" rx="5.5" ry="2.2" transform="rotate(390 53.4 20.6) translate(4.9 0)"/><ellipse cx="74.2" cy="93.2" rx="8.9" ry="3.6" transform="rotate(-62 74.2 93.2) translate(7.9 0)"/><ellipse cx="74.2" cy="93.2" rx="8.9" ry="3.6" transform="rotate(18 74.2 93.2) translate(7.9 0)"/><ellipse cx="84.7" cy="86.9" rx="8.5" ry="3.4" transform="rotate(-80 84.7 86.9) translate(7.5 0)"/><ellipse cx="84.7" cy="86.9" rx="8.5" ry="3.4" transform="rotate(-0 84.7 86.9) translate(7.5 0)"/><ellipse cx="92.6" cy="77.6" rx="8.1" ry="3.2" transform="rotate(-99 92.6 77.6) translate(7.1 0)"/><ellipse cx="92.6" cy="77.6" rx="8.1" ry="3.2" transform="rotate(-19 92.6 77.6) translate(7.1 0)"/><ellipse cx="97.1" cy="66.2" rx="7.7" ry="3.1" transform="rotate(-118 97.1 66.2) translate(6.8 0)"/><ellipse cx="97.1" cy="66.2" rx="7.7" ry="3.1" transform="rotate(-38 97.1 66.2) translate(6.8 0)"/><ellipse cx="97.8" cy="54.0" rx="7.2" ry="2.9" transform="rotate(-136 97.8 54.0) translate(6.4 0)"/><ellipse cx="97.8" cy="54.0" rx="7.2" ry="2.9" transform="rotate(-56 97.8 54.0) translate(6.4 0)"/><ellipse cx="94.6" cy="42.2" rx="6.8" ry="2.7" transform="rotate(-154 94.6 42.2) translate(6.0 0)"/><ellipse cx="94.6" cy="42.2" rx="6.8" ry="2.7" transform="rotate(-74 94.6 42.2) translate(6.0 0)"/><ellipse cx="87.8" cy="32.1" rx="6.4" ry="2.5" transform="rotate(-173 87.8 32.1) translate(5.6 0)"/><ellipse cx="87.8" cy="32.1" rx="6.4" ry="2.5" transform="rotate(-93 87.8 32.1) translate(5.6 0)"/><ellipse cx="78.1" cy="24.6" rx="5.9" ry="2.4" transform="rotate(-192 78.1 24.6) translate(5.2 0)"/><ellipse cx="78.1" cy="24.6" rx="5.9" ry="2.4" transform="rotate(-112 78.1 24.6) translate(5.2 0)"/><ellipse cx="66.6" cy="20.6" rx="5.5" ry="2.2" transform="rotate(-210 66.6 20.6) translate(4.9 0)"/><ellipse cx="66.6" cy="20.6" rx="5.5" ry="2.2" transform="rotate(-130 66.6 20.6) translate(4.9 0)"/><circle cx="60" cy="98" r="5"/></g></svg>
          <p class="eyebrow">GHABA × ORS Olive Oil</p>
          <h1 id="start-title">Stylist of the Future</h1>
          <p class="lede">Put on your olive-leaf crown and share it to your Stories.</p>
          <button id="btn-start" class="btn primary" type="button">Start camera</button>
          <label class="btn link" for="file-input">or upload a photo</label>
        </div>
      </section>

      <div class="topbar">
        <button id="btn-back" class="icon-btn" type="button" aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <div class="topbar-right">
          <button id="btn-fit" class="icon-btn" type="button" aria-label="Fill the frame" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
          </button>
          <button id="btn-flip" class="icon-btn" type="button" aria-label="Switch camera">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4" /></svg>
          </button>
        </div>
      </div>
      <p id="status" class="status" role="status" hidden></p>
    </div>

    <div class="dock">
      <div id="looks" class="looks" role="radiogroup" aria-label="Look"></div>

      <div class="camera-dock">
        <label class="icon-btn" for="file-input" aria-label="Upload a photo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3" /><path d="M3 16l5-5 4 4 3-3 6 6" /><circle cx="16" cy="9" r="1.5" /></svg>
        </label>
        <button id="btn-shutter" class="shutter" type="button" aria-label="Take photo"></button>
        <span class="dock-spacer" aria-hidden="true"></span>
      </div>

      <div class="result-dock">
        <input id="name" type="text" maxlength="40" placeholder="Add your name" autocomplete="name" aria-label="Your name" />
        <div id="size-row" class="size-row" hidden>
          <label for="crown-size">Crown size</label>
          <input id="crown-size" type="range" min="0.6" max="1.8" step="0.01" value="1" />
          <p class="muted">No face found. Drag the crown into place.</p>
        </div>
        <div class="actions">
          <button id="btn-save" class="btn primary" type="button">Save to Stories</button>
          <button id="btn-share" class="icon-btn solid" type="button" aria-label="Share" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" /></svg>
          </button>
        </div>
      </div>
    </div>

    <input id="file-input" type="file" accept="image/*" hidden />
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="js/app.js" defer></script>
</body>
</html>
